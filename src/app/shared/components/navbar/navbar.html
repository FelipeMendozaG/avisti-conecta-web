<header class="sticky top-0 z-40 border-b border-slate-200/80 bg-white/90 backdrop-blur">
  <div class="mx-auto flex h-16 max-w-7xl items-center justify-between gap-4 px-4 sm:px-6 lg:px-8">
    <a routerLink="/" class="shrink-0" (click)="closeMenu()">
      <app-brand />
    </a>

    <nav class="hidden items-center gap-1 lg:flex" aria-label="Principal">
      <a
        routerLink="/"
        fragment="como-funciona"
        class="rounded-lg px-3 py-2 text-sm font-medium text-slate-600 transition hover:bg-slate-100 hover:text-slate-900"
      >
        Cómo funciona
      </a>
      <a
        routerLink="/catalogo"
        class="rounded-lg px-3 py-2 text-sm font-medium text-slate-600 transition hover:bg-slate-100 hover:text-slate-900"
        routerLinkActive="bg-emerald-50 text-emerald-700"
      >
        Catálogo
      </a>
    </nav>

    <div class="hidden items-center gap-2 lg:flex">
      @if (isAuthenticated()) {
        <a
          routerLink="/panel"
          class="inline-flex items-center gap-2 rounded-lg bg-emerald-600 px-4 py-2 text-sm font-semibold text-white transition hover:bg-emerald-700"
        >
          Mi panel
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="h-4 w-4" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5L21 12l-7.5 7.5M21 12H3" />
          </svg>
        </a>
      } @else {
        <a
          routerLink="/ingresar"
          class="rounded-lg px-4 py-2 text-sm font-medium text-slate-700 transition hover:bg-slate-100"
        >
          Ingresar
        </a>
        <a
          routerLink="/registro"
          class="inline-flex items-center rounded-lg bg-emerald-600 px-4 py-2 text-sm font-semibold text-white transition hover:bg-emerald-700"
        >
          Crear cuenta
        </a>
      }
    </div>

    <button
      type="button"
      class="rounded-lg p-2 text-slate-600 transition hover:bg-slate-100 lg:hidden"
      (click)="toggleMenu()"
      [attr.aria-expanded]="menuOpen()"
      aria-label="Abrir menú"
    >
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="h-6 w-6" aria-hidden="true">
        @if (menuOpen()) {
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        } @else {
          <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
        }
      </svg>
    </button>
  </div>

  @if (menuOpen()) {
    <nav class="border-t border-slate-200 bg-white px-4 py-3 lg:hidden" aria-label="Menú móvil">
      <div class="flex flex-col gap-1">
        <a
          routerLink="/"
          fragment="como-funciona"
          class="rounded-lg px-3 py-2.5 text-sm font-medium text-slate-700 hover:bg-slate-100"
          (click)="closeMenu()"
        >
          Cómo funciona
        </a>
        <a
          routerLink="/catalogo"
          class="rounded-lg px-3 py-2.5 text-sm font-medium text-slate-700 hover:bg-slate-100"
          (click)="closeMenu()"
        >
          Catálogo
        </a>

        @if (isAuthenticated()) {
          <a
            routerLink="/panel"
            class="mt-1 rounded-lg bg-emerald-600 px-3 py-2.5 text-center text-sm font-semibold text-white"
            (click)="closeMenu()"
          >
            Mi panel
          </a>
        } @else {
          <a
            routerLink="/ingresar"
            class="rounded-lg px-3 py-2.5 text-sm font-medium text-slate-700 hover:bg-slate-100"
            (click)="closeMenu()"
          >
            Ingresar
          </a>
          <a
            routerLink="/registro"
            class="mt-1 rounded-lg bg-emerald-600 px-3 py-2.5 text-center text-sm font-semibold text-white"
            (click)="closeMenu()"
          >
            Crear cuenta
          </a>
        }
      </div>
    </nav>
  }
</header>
