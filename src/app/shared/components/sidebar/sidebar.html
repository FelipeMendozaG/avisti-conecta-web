<!-- Backdrop del cajón móvil -->
@if (open()) {
  <div
    class="fixed inset-0 z-40 bg-slate-950/40 backdrop-blur-sm lg:hidden"
    (click)="close.emit()"
    aria-hidden="true"
  ></div>
}

<!-- Lateral de navegación -->
<aside
  class="fixed inset-y-0 left-0 z-50 flex w-64 flex-col border-r border-slate-200 bg-white transition-transform duration-200 lg:translate-x-0"
  [class.-translate-x-full]="!open()"
  [class.translate-x-0]="open()"
  aria-label="Navegación del panel"
>
  <div class="flex h-16 items-center justify-between border-b border-slate-100 px-5">
    <a routerLink="/" (click)="close.emit()">
      <app-brand />
    </a>
    <button
      type="button"
      class="rounded-lg p-1.5 text-slate-400 hover:bg-slate-100 hover:text-slate-600 lg:hidden"
      (click)="close.emit()"
      aria-label="Cerrar menú"
    >
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="h-5 w-5" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>
  </div>

  <nav class="flex-1 space-y-1 overflow-y-auto px-3 py-4">
    @for (item of navItems; track item.path) {
      <a
        [routerLink]="item.path"
        [routerLinkActiveOptions]="{ exact: item.end }"
        routerLinkActive="bg-emerald-50 text-emerald-700"
        class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium text-slate-600 transition hover:bg-slate-100 hover:text-slate-900"
        (click)="close.emit()"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          class="h-5 w-5 shrink-0"
          aria-hidden="true"
        >
          <path stroke-linecap="round" stroke-linejoin="round" [attr.d]="item.icon" />
        </svg>
        {{ item.label }}
      </a>
    }
  </nav>

  <div class="border-t border-slate-100 p-4">
    @if (user(); as currentUser) {
      <div class="flex items-center gap-3">
        <span
          class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full bg-emerald-100 text-sm font-semibold uppercase text-emerald-700"
        >
          {{ currentUser.name.charAt(0) }}
        </span>
        <div class="min-w-0 flex-1">
          <p class="truncate text-sm font-medium text-slate-900">{{ currentUser.name }}</p>
          <p class="truncate text-xs text-slate-500">{{ currentUser.email }}</p>
        </div>
      </div>
      <button
        type="button"
        class="mt-3 flex w-full items-center justify-center gap-2 rounded-lg border border-slate-200 px-3 py-2 text-sm font-medium text-slate-600 transition hover:border-rose-200 hover:bg-rose-50 hover:text-rose-600"
        (click)="logout()"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" class="h-4 w-4" aria-hidden="true">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15m3 0l3-3m0 0l-3-3m3 3H9"
          />
        </svg>
        Cerrar sesión
      </button>
    }
  </div>
</aside>
