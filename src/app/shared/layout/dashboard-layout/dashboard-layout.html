<div class="min-h-dvh bg-slate-50">
  <app-sidebar [open]="sidebarOpen()" (close)="closeSidebar()" />

  <div class="flex min-h-dvh flex-col lg:pl-64">
    <!-- Barra superior (solo móvil/tablet) -->
    <header class="sticky top-0 z-30 flex h-16 items-center gap-3 border-b border-slate-200 bg-white/90 px-4 backdrop-blur sm:px-6 lg:hidden">
      <button
        type="button"
        class="rounded-lg p-2 text-slate-600 transition hover:bg-slate-100"
        (click)="openSidebar()"
        aria-label="Abrir menú"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="h-6 w-6" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
        </svg>
      </button>
      <span class="text-sm font-semibold text-slate-900">Avisti Connect</span>
    </header>

    <main class="mx-auto w-full max-w-7xl flex-1 px-4 py-6 sm:px-6 lg:px-8 lg:py-8">
      <router-outlet />
    </main>
  </div>
</div>
